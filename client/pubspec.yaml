name: vitalloop
description: "VitalLoop: a health tracker whose screens are generated by Gemini as A2UI and rendered with genui."
# An app, not a package: never published to pub.dev.
publish_to: 'none'

# <version name>+<build number>; see https://dart.dev/tools/pub/pubspec#version.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  a2ui_core: ^0.1.1
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  genui: ^0.10.4
  genui_a2a: ^0.10.1
  go_router: ^18.1.1
  google_fonts: ^8.2.1
  http: ^1.6.0
  json_schema_builder: ^0.1.7
  latlong2: ^0.10.1
  logger: ^2.8.0
  logging: ^1.3.0
  pdf: ^3.13.1
  printing: ^5.15.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
