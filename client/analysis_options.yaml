# Static analysis for the client.
#
# Follows the rules the Flutter team uses for genui
# (https://github.com/flutter/genui/blob/main/analysis_options.yaml), on top
# of flutter_lints, plus doc comments on every public member.
# Run with `flutter analyze`. See https://dart.dev/tools/analysis.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Consistency.
    - avoid_print
    - combinators_ordering
    - directives_ordering
    - lines_longer_than_80_chars
    - prefer_asserts_in_initializer_lists
    - prefer_const_constructors
    - prefer_relative_imports
    - prefer_single_quotes
    - sort_pub_dependencies
    - unnecessary_lambdas
    - unnecessary_library_directive
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_is_even_rather_than_modulo

    # Correctness.
    - always_declare_return_types
    - avoid_annotating_with_dynamic
    - avoid_catching_errors
    - avoid_dynamic_calls
    - comment_references
    - conditional_uri_does_not_exist
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unreachable_from_main

    # Types: write them where they aren't obvious, leave them out where they
    # are.
    - omit_obvious_local_variable_types
    - specify_nonobvious_local_variable_types
    - specify_nonobvious_property_types
    - strict_top_level_inference

    # Documentation: every public class, function and field.
    - public_member_api_docs
